# worksearchcollective.com, the Work Search Collective's site, on the Foundry box
# (65.38.96.240). Today it serves the Daily Splat at /splat/. The front page
# belongs to the Collective; until it has one, it sends visitors to the Splat
# with a 302, so no browser remembers that as permanent.
#
# THIS FILE IS THE SOURCE. It deploys to
# /etc/nginx/sites-available/worksearchcollective.com, and
# sites-enabled/worksearchcollective.com is a SYMLINK to it, so what is here is
# what nginx serves. To deploy a change:
#
#     cat infra/nginx/worksearchcollective.com.conf | ssh foundry@65.38.96.240 \
#       'sudo tee /etc/nginx/sites-available/worksearchcollective.com >/dev/null \
#        && sudo nginx -t && sudo systemctl reload nginx'
#
# Cloudflare proxies the zone, SSL mode Full (strict). The certificate is Let's
# Encrypt on this box, issued and renewed through certbot's dns-cloudflare
# plugin (/etc/letsencrypt/secrets/cloudflare.ini), like iambraun.com's, so
# renewal needs nothing on port 80.
#
# The Splat moved here from iambraun.com/cv/job-sources/daily-splat/ on
# 2026-11-13. iambraun.com's own nginx config (WorkflowtechAI/iambraun.com,
# infra/nginx/iambraun.com.conf) answers the old address with a 301 to /splat/.

# html and json revalidate on every visit: jobs.json changes every morning.
map $uri $wsc_cache {
    default            "";
    ~\.(?:html|json)$  "no-cache";
}

# The Splat's intake form (infra/intake.py): two a minute per visitor, as on
# iambraun.com. Keyed on the visitor, who is $binary_remote_addr once real_ip
# below has read Cloudflare's CF-Connecting-IP. A zone of its own: zones are
# global, and iambraun.com's (splatintake) goes when that host stops taking
# the form.
limit_req_zone $binary_remote_addr zone=wsc_splatintake:10m rate=2r/m;

# Plain HTTP, every name: one hop to the canonical https host.
server {
    listen 80;
    server_name worksearchcollective.com www.worksearchcollective.com
                worksearchcollective.org www.worksearchcollective.org;
    return 301 https://worksearchcollective.com$request_uri;
}

# www to the apex.
server {
    listen 443 ssl http2;
    server_name www.worksearchcollective.com;

    ssl_certificate     /etc/letsencrypt/live/worksearchcollective.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worksearchcollective.com/privkey.pem;

    return 301 https://worksearchcollective.com$request_uri;
}

# .org to .com. A name no 443 server claims goes to the first one loaded on
# this box, benesseremedestetica.com, so this block has to exist before any
# record for a new name points here. .org's own certificate (Let's Encrypt,
# dns-cloudflare, like .com's) was issued 2026-11-13.
server {
    listen 443 ssl http2;
    server_name worksearchcollective.org www.worksearchcollective.org;

    ssl_certificate     /etc/letsencrypt/live/worksearchcollective.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worksearchcollective.org/privkey.pem;

    return 301 https://worksearchcollective.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name worksearchcollective.com;

    ssl_certificate     /etc/letsencrypt/live/worksearchcollective.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worksearchcollective.com/privkey.pem;

    root /var/www/worksearchcollective.com;
    index index.html;
    add_header Cache-Control $wsc_cache;

    # THE VISITOR'S OWN ADDRESS, as on iambraun.com: every request arrives from
    # Cloudflare, which names the visitor in CF-Connecting-IP. Trusted only from
    # Cloudflare's published ranges (https://www.cloudflare.com/ips/, the list
    # iambraun.com read 2026-09-24), so a request made straight to this box
    # cannot name itself someone else. $remote_addr is the visitor from here on:
    # in the access log and in the intake rate limit. Nothing in this server
    # allows or denies by address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location = / { return 302 /splat/; }

    # The Splat: the page, changes.html, jobs.json (daily-splat.service) and
    # companies.json (company-check.service), all in /var/www/worksearchcollective.com/splat/.
    location = /splat { return 301 /splat/; }
    location /splat/ {
        try_files $uri $uri/ =404;
    }

    # A Splat tab opened at the old iambraun.com address before the move
    # fetches companies.json on its first Company check click; that request
    # now follows a 301 here, cross-origin, and the browser needs this header to
    # read it. Remove after 2026-12-13, with iambraun.com's old intake block.
    # Cache-Control is repeated because an add_header in a location replaces
    # the server's.
    location = /splat/companies.json {
        add_header Cache-Control $wsc_cache;
        add_header Access-Control-Allow-Origin "https://iambraun.com";
    }

    # The Splat's intake form. infra/intake.py emails each post to David through
    # Graph and keeps shared jobs in its own state, nothing in the docroot.
    location = /api/splat-intake {
        limit_except POST { deny all; }
        limit_req zone=wsc_splatintake burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    # Nothing else lives here yet.
    location / {
        return 404;
    }
}
